StylesPath = .vale/styles
MinAlertLevel = error
# The existing installer verifies both release archives before Vale loads them.
Packages = .tools/doc-tools/0.1.0/style-packages/Google.zip, .tools/doc-tools/0.1.0/style-packages/DocTools.zip

[*.md]
BasedOnStyles = Google, DocTools
Google.Contractions = NO

# Generated artifact: CHANGELOG.md is produced by release-please from the
# Conventional Commit history (#1776). It is machine-owned release output plus
# preserved release history, not hand-written prose, so it is not prose-linted.
[CHANGELOG.md]
BasedOnStyles =

# Machine-owned provisioner release history.
[shifter/engine/provisioner/CHANGELOG.md]
BasedOnStyles =

# Retained release fragments are exact historical records (ADR-042).
[changelog.d/*.md]
BasedOnStyles =

# Contributor Covenant text is preserved third-party policy wording.
[CODE_OF_CONDUCT.md]
BasedOnStyles =
