apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-client
  namespace: {{ .Values.namespaces.platform }}
  annotations:
    # env-var-secret matches every variable name that contains "secret".
    # JSON_SECRET_KEY_FILE holds a file path; the key is in the mounted file.
    # Verified false positive; see docs/adr/exceptions.yaml.
    ignore-check.kube-linter.io/env-var-secret: JSON_SECRET_KEY_FILE holds the path of a mounted Secret file, not a secret value
    {{- if .Values.capacityProfile.id }}
    shifter.dev/capacity-profile: {{ .Values.capacityProfile.id | quote }}
    {{- end }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: guacamole-client
spec:
  replicas: {{ .Values.guacamoleClient.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: guacamole-client
  template:
    metadata:
      labels:
        {{- include "shifter.partOfLabels" . | nindent 8 }}
        app.kubernetes.io/component: guacamole-client
        {{- if .Values.capacityProfile.id }}
        shifter.dev/capacity-profile: {{ .Values.capacityProfile.id | quote }}
        {{- end }}
      annotations:
        checksum/runtime-config: {{ include "shifter.runtimeConfigChecksum" . }}
    spec:
      # The group lets UID 10001 read the root-owned Secret projection.
      securityContext:
        fsGroup: {{ .Values.security.guacamole.runAsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: {{ .Values.security.pod.seccompProfile }}
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccounts.guacamoleClient.name }}
      terminationGracePeriodSeconds: {{ .Values.guacamoleClient.terminationGracePeriodSeconds }}
      {{- include "shifter.cloudSqlProxyPod" (dict "root" . "autoIam" false) | nindent 6 }}
      containers:
        - name: guacamole-client
          image: {{ include "shifter.guacamoleClientImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "shifter.containerSecurityContextGuacamole" . | nindent 10 }}
          # readOnlyRootFilesystem is on; the Guacamole entrypoint generates its
          # config under /home/guacamole/.guacamole at startup, so that home needs
          # a writable volume in addition to /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: guacamole-home
              mountPath: /home/guacamole
            # Credentials arrive as files, never as environment values. Keep
            # this path outside every writable home.
            - name: guacamole-runtime
              mountPath: /run/secrets/guacamole-runtime
              readOnly: true
          env:
            - name: OPENFGA_ENABLED
              value: "true"
            {{- if eq .Values.provider.name "gcp" }}
            # Keep native control HTTPS inside the existing CONNECT boundary.
            - name: JAVA_OPTS
              value: "-Dhttps.proxyHost=content-egress -Dhttps.proxyPort=3128"
            {{- end }}
            {{- $controlEnv := list "GUACAMOLE_CONTROL_URL" "GUACAMOLE_CONTROL_AUDIENCE" }}
            {{- if eq .Values.provider.name "aws" }}
            {{- /* AWS (#2313): STS web identity selection and the SDK region. */}}
            {{- $controlEnv = concat $controlEnv (list "GUACAMOLE_CONTROL_IDENTITY" "AWS_REGION") }}
            {{- end }}
            {{- range $name := $controlEnv }}
            - name: {{ $name }}
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: {{ $name }}
                  optional: true
            {{- end }}
            - name: GUACD_HOSTNAME
              value: guacd
            - name: GUACD_PORT
              value: "4822"
            - name: POSTGRESQL_HOSTNAME
              {{- if .Values.cloudSqlProxy.enabled }}
              value: "127.0.0.1"
              {{- else }}
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_POSTGRESQL_HOSTNAME
              {{- end }}
            - name: POSTGRESQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_POSTGRESQL_PORT
            - name: POSTGRESQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: platform-runtime
                  key: GUACAMOLE_POSTGRESQL_DATABASE
            - name: POSTGRESQL_AUTO_CREATE_ACCOUNTS
              value: "true"
            - name: POSTGRESQL_ABSOLUTE_MAX_CONNECTIONS
              value: {{ .Values.guacamoleClient.postgresqlAbsoluteMaxConnections | quote }}
            - name: JSON_ENABLED
              value: "true"
            - name: OPENID_ENABLED
              value: "false"
            # Idle limit of a Guacamole session in minutes. Guacamole never
            # times out a session with an open connection. This limit only
            # frees sessions with no connection, which each hold an authority
            # lease.
            - name: API_SESSION_TIMEOUT
              value: "15"
            # Guacamole reads each property from the file that its *_FILE
            # variable names. The variables carry paths only.
            - name: POSTGRESQL_USERNAME_FILE
              value: /run/secrets/guacamole-runtime/postgresql-username
            - name: POSTGRESQL_PASSWORD_FILE
              value: /run/secrets/guacamole-runtime/postgresql-password
            - name: JSON_SECRET_KEY_FILE
              value: /run/secrets/guacamole-runtime/json-secret-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 60
          resources:
            {{- toYaml .Values.guacamoleClient.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit | quote }}
        - name: guacamole-home
          emptyDir:
            sizeLimit: 64Mi
        - name: guacamole-runtime
          secret:
            secretName: {{ .Values.guacamoleRuntimeSecret.name }}
            defaultMode: 0440
            items:
              - key: POSTGRESQL_USER
                path: postgresql-username
              - key: POSTGRESQL_PASSWORD
                path: postgresql-password
              - key: JSON_SECRET_KEY
                path: json-secret-key
