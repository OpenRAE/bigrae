apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-bootstrap-prune
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: guacamole-bootstrap-prune
spec:
  replicas: {{ .Values.workers.guacamolePrune.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: guacamole-bootstrap-prune
  template:
    metadata:
      labels:
        {{- include "shifter.partOfLabels" . | nindent 8 }}
        app.kubernetes.io/component: guacamole-bootstrap-prune
      annotations:
        checksum/runtime-config: {{ include "shifter.runtimeConfigChecksum" . }}
    spec:
      {{- include "shifter.podSecurityContext" . | nindent 6 }}
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccounts.workers.name }}
      {{- include "shifter.cloudSqlProxyPod" (dict "root" . "autoIam" true) | nindent 6 }}
      containers:
        - name: guacamole-bootstrap-prune
          image: {{ include "shifter.portalImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "shifter.containerSecurityContextApp" . | nindent 10 }}
          {{- include "shifter.tmpVolumeMount" . | nindent 10 }}
          args: ["python", "manage.py", "run_guacamole_bootstrap_prune"]
          {{- if or .Values.cloudSqlProxy.enabled .Values.openfga.enabled .Values.rdsIam.enabled }}
          env:
            {{- include "shifter.databaseUserEnv" (dict "root" . "role" "workers") | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: platform-runtime
          # The worker refreshes its heartbeat during each cycle. The 10-minute
          # window and the 30-minute first liveness check are the safety margin
          # for a slow cycle under event load.
          readinessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/guacamole-bootstrap-prune-heartbeat -mmin -10 | grep -q ."]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/guacamole-bootstrap-prune-heartbeat -mmin -10 | grep -q ."]
            initialDelaySeconds: 1800
            periodSeconds: 30
          resources:
            {{- toYaml .Values.workers.guacamolePrune.resources | nindent 12 }}
      {{- include "shifter.tmpVolume" . | nindent 6 }}
