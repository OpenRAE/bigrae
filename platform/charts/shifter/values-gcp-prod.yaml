provider:
  name: gcp
profile: prod

deployment:
  profile: prod

capabilities:
  gcpBackendConfig: true
  gcpManagedTls: true
  kubernetesJobLauncher: true
  gcpAccessNodePool: true

images:
  platform: us-docker.pkg.dev/placeholder-project/shifter/platform@sha256:1111111111111111111111111111111111111111111111111111111111111111
  guacd: us-docker.pkg.dev/placeholder-project/shifter/guacd@sha256:2222222222222222222222222222222222222222222222222222222222222222
  guacamoleClient: us-docker.pkg.dev/placeholder-project/shifter/guacamole-client@sha256:3333333333333333333333333333333333333333333333333333333333333333

imagePullPolicy: Always

portal:
  replicas: 2

workers:
  cms:
    replicas: 2
  engine:
    replicas: 2
  mc:
    replicas: 2
  ctfScheduler:
    replicas: 1

guacd:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 32
    maxReplicas: 48
    cpuUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 900

# Single guacamole-client replica (#928, #2518). The portal mints each Guacamole
# token server to server through the internal Service, and session revocation
# deletes it the same way. Guacamole keeps tokens in the memory of one replica,
# so with more replicas a browser can reach a replica without its token, and a
# revocation can miss the live session. Browser affinity alone does not fix the
# server-side legs. Scale guacd for capacity until #2518 shards the client.
guacamoleClient:
  replicas: 1

services:
  portal:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: true
  guacamoleClient:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: true

network:
  ingressSourceCidrs:
    - 35.191.0.0/16
    - 130.211.0.0/22
  providerApiCidrs:
    - 199.36.153.4/30
    - 199.36.153.8/30

edge:
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: gce
