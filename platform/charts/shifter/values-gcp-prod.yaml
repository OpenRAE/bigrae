provider:
  name: gcp
profile: prod

deployment:
  profile: prod

capabilities:
  gcpBackendConfig: true
  gcpManagedTls: true
  kubernetesJobLauncher: true
  gcpAccessNodePool: true

images:
  platform: us-docker.pkg.dev/placeholder-project/shifter/platform@sha256:1111111111111111111111111111111111111111111111111111111111111111
  guacd: us-docker.pkg.dev/placeholder-project/shifter/guacd@sha256:2222222222222222222222222222222222222222222222222222222222222222
  guacamoleClient: us-docker.pkg.dev/placeholder-project/shifter/guacamole-client@sha256:3333333333333333333333333333333333333333333333333333333333333333

imagePullPolicy: Always

portal:
  replicas: 2

workers:
  cms:
    replicas: 2
  engine:
    replicas: 2
  mc:
    replicas: 2
  ctfScheduler:
    replicas: 1

guacd:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 32
    maxReplicas: 48
    cpuUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 900

# guacamole-client scales horizontally. Session affinity (GENERATED_COOKIE) on
# the GCE BackendConfig ensures the GCE L7 LB pins each browser session to one
# pod so in-memory Guacamole tunnels are not broken by routing to a different
# replica. POSTGRESQL_ABSOLUTE_MAX_CONNECTIONS is set per-replica; the product
# of replicas × value must stay below the Cloud SQL max_connections limit (1000).
guacamoleClient:
  replicas: 2
  postgresqlAbsoluteMaxConnections: 500
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 900

services:
  portal:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: true
  guacamoleClient:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: true
      sessionAffinity:
        enabled: true
        affinityType: GENERATED_COOKIE
        affinityCookieTtlSec: 86400

network:
  ingressSourceCidrs:
    - 35.191.0.0/16
    - 130.211.0.0/22
  providerApiCidrs:
    - 199.36.153.4/30
    - 199.36.153.8/30

edge:
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: gce
