name: Vale

# Google errors gate changed Markdown. Vale and STE gate rewritten pages.
# CI reports the remaining corpus during migration. See ADR enforcement docs.
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".vale.ini"
      - ".ste-required.txt"
      - "tools/install-vale.sh"
      - "Makefile"
      - ".github/workflows/vale.yml"
      - "scripts/adr_guard/tests/test_documentation_tools.py"

permissions:
  contents: read

concurrency:
  group: vale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: Docs prose (changed Markdown)
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified tools and styles
        run: make docs-tools
      - name: Lint changed Markdown
        run: make docs-changed
      - name: Check rewritten pages
        run: make docs-required
      - name: Verify failing and corrected prose samples
        run: |
          set -euo pipefail
          sample="${RUNNER_TEMP}/doc-tools-sample.md"
          report="${RUNNER_TEMP}/doc-tools-sample.json"
          cat > "$sample" <<'EOF'
          You can't start the lab until you have read all instructions and verified each prerequisite on the host that will run this synthetic exercise on the supported installation today.

          The lab has a network. It has a server. It has a client. It has a router. It has a log. It has a clock. It has a disk.
          EOF
          if bash .tools/doc-tools/0.1.0/tools/ste-lint.sh --format json "$sample" > "$report"; then
            echo 'The negative sample must fail.' >&2
            exit 1
          fi
          jq -e '[.findings[].rule_id] | unique == ["STE-4.2", "STE-5.1", "STE-6.6"]' "$report"
          printf 'Read the instructions. Verify the prerequisites. Then start the lab.\n' > "$sample"
          bash .tools/doc-tools/0.1.0/tools/ste-lint.sh "$sample"
          # Preserved policy text must not silence the maintained addendum.
          cat CONTRIBUTING.md > "$sample"
          printf '\nYou cannot skip this check.\n' >> "$sample"
          bash .tools/doc-tools/0.1.0/tools/ste-lint.sh "$sample"
          printf "\nYou can't skip this check.\n" >> "$sample"
          if bash .tools/doc-tools/0.1.0/tools/ste-lint.sh --format json "$sample" > "$report"; then
            echo 'The maintained addendum must remain checked.' >&2
            exit 1
          fi
          jq -e 'any(.findings[]; .rule_id == "STE-4.2")' "$report"
      - name: Report legacy prose findings
        run: make docs-report
