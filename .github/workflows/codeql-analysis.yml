name: CodeQL

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  # `CodeQL` is a required context on `dev`, and `dev` merges through a merge
  # queue (ADR-003-R9). Code scanning reports the context on a merge group only
  # when the analysis runs on the merge_group event.
  merge_group:
    types: [checks_requested]
  schedule:
    # Weekly Sunday 06:00 UTC re-scan to catch any drift between PR runs.
    - cron: '0 6 * * 0'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # github/codeql-action v4.35.4
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: ${{ matrix.language }}
          # security-extended adds higher-confidence security queries on top of
          # the default suite (per GitHub's documented query suites).
          queries: security-extended
          # Path filters (excludes intentionally-vulnerable scenario targets).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        # github/codeql-action v4.35.4
        uses: github/codeql-action/autobuild@68bde559dea0fdcac2102bfdf6230c5f70eb485e

      - name: Perform CodeQL Analysis
        # github/codeql-action v4.35.4
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: "/language:${{ matrix.language }}"
