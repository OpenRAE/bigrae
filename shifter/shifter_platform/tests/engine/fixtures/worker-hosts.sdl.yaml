name: synthetic-worker-hosts
description: Synthetic two-VM outer apparatus without an experiment runtime.
nodes:
  lan:
    type: Switch
  victim:
    type: compute
    os: linux
    os_distribution: x-shifter:alpine
    os_version: "3.19"
    source: {name: victim-host, version: "3.19"}
    resources: {ram: 8 gib, cpu: 2}
  workstation:
    type: compute
    os: linux
    os_distribution: x-shifter:alpine
    os_version: "3.19"
    source: {name: alpine, version: "3.19"}
    resources: {ram: 8 gib, cpu: 2}
infrastructure:
  lan:
    count: 1
    properties: {cidr: 10.50.0.0/24, gateway: 10.50.0.1}
  victim:
    count: 1
    links: [lan]
    properties:
      - lan: 10.50.0.11
  workstation:
    count: 1
    links: [lan]
    properties:
      - lan: 10.50.0.10
realization:
  constraints:
    - field_pointer: /nodes/workstation
      concern: compute-substrate
      posture: exact
      domain: {kind: exact, value: virtual-machine}
    - field_pointer: /nodes/victim
      concern: compute-substrate
      posture: exact
      domain: {kind: exact, value: virtual-machine}
