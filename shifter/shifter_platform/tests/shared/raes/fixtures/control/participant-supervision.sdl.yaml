name: synthetic-participant-supervision
description: Synthetic reusable participant policy for SDK owner and admission tests;
  no native effect capability.
nodes:
  lan:
    type: Switch
  web:
    type: compute
    os: linux
    os_distribution: x-shifter:alpine
    os_version: '3.19'
    source:
      name: alpine
      version: '3.19'
    resources:
      ram: 512 mib
      cpu: 1
infrastructure:
  lan:
    count: 1
    properties:
      cidr: 10.51.0.0/24
      gateway: 10.51.0.1
  web:
    count: 1
    links:
    - lan
    properties:
    - lan: 10.51.0.10
entities:
  analyst-team:
    description: Participant team the interactive access is offered to.
    role: blue
accounts:
  analyst:
    username: analyst
    node: web
    auth_method: key
agents:
  analyst:
    affiliations:
    - analyst-team
    description: Participant offered SSH to the web host.
    starting_accounts:
    - analyst
    interactive_access:
      web-ssh:
        target_ref: web
        channel: ssh
        account_ref: analyst
    authority_anchors:
    - entities.analyst-team
    operating_scope:
    - nodes.web
realization:
  constraints:
  - field_pointer: /nodes/web
    concern: compute-substrate
    posture: exact
    domain:
      kind: exact
      value: virtual-machine
behavior_specifications:
  controlled:
    semantic_version: 1.0.0
    participant_refs:
    - analyst
    authority_scope_refs:
    - nodes.web
    behavior_mode: mixed-control
    extension_policy: closed
    mixed_control:
      semantics: mixed-control-policy-occurrence/rev1
      form: reusable-policy
      participant_ref: analyst
      policy_revision: 1.0.0
      order_strategy: total-effective-order
      initial_state_ref: active
      dispositions:
        duplicate: idempotent-if-equivalent
        stale: reject-no-state-change
        revoked: reject-no-state-change
        late: reject-no-state-change
        concurrent: order-then-revalidate
        conflict: reject-no-state-change
      controller_states:
        active:
          controller_ref: self
          authority_basis_refs:
          - entities.analyst-team
          scope_refs:
          - nodes.web
          policy_revision: 1.0.0
          valid_from_order: 0
          valid_until_order: 100
          authority_status: active
          evidence_refs:
          - entities.analyst-team
      permitted_transitions:
        propose:
          transition_kind: proposal
          from_state_ref: active
          to_state_ref: active
          valid_from_order: 0
          valid_until_order: 100
          evidence_refs:
          - entities.analyst-team
