# In-box environment-pack manifest (#1578, ADR-034).
#
# Declares the in-box bootstrap seed: the scenario packs registered into the
# tenant by default. The bootstrap
# (`cms.scenarios.inbox.register_inbox_packs`, invoked by the
# `bootstrap_inbox_catalog` management command) registers each entry through the
# SAME `cms.services.register_pack` service an operator uses. The in-box seed
# therefore has NO privileged load path — it is dogfooded through the uniform
# ingestion boundary (ADR-053/ADR-034).
#
# Only packs whose bytes ship inside the portal image belong here, because the
# bootstrap resolves each `package_ref` under `RAES_PACKAGE_ROOT` (the app root
# `/app` in the deployed container). Each `package_ref` names a runtime
# destination, not a source path. The canonical pack sources live under
# `shifter/environment-packs/` (#2550), and the portal Dockerfile copies each
# pack declared here from that collection to its `package_ref`. Keep this list
# and those explicit copies in agreement; a pack in the collection is not
# shipped or registered unless it has both. Private scenario packs whose bytes
# are not in the public image (for example proprietary customer content) are
# registered out-of-band where their bytes exist, not from this shipped seed.
#
packs:
  - scenario_id: smoke-linux
    source_kind: repo
    contract_kind: raes
    contract_profile: shifter
    package_ref: cms/scenarios/inbox_packs/smoke-linux
    package_version: "0.4.0"
    expected_package_digest: sha256:d68f85e09696ac91c39398482a245db24b3733e36da03f6424c09371744f9d91
    package_digest: sha256:7e96c1da428b525330376a1f1b3d6eb0de11ff81576063dd8bb7addf92b57c49
    provenance:
      repo: Brad-Edwards/bigrae
  # Portable-addressing variant of smoke-linux for the AWS EC2 range backend
  # (which allocates subnet CIDRs inside the range VPC and refuses authored
  # addressing). The AWS post-deploy smoke resolves the 'linux' variant to this
  # scenario. Tracked for convergence with smoke-linux in the unite-variants
  # follow-up (#2415).
  - scenario_id: smoke-linux-aws
    source_kind: repo
    contract_kind: raes
    contract_profile: shifter
    package_ref: cms/scenarios/inbox_packs/smoke-linux-aws
    package_version: "0.4.0"
    expected_package_digest: sha256:dc71d76107a54be22f0e32f17802678f3f893ebfbe3d6ccf135f8b586a1a72ff
    package_digest: sha256:e6e3adfbb65aef880ac16e18fd9db596d0636ea31b2ede82b7aae0d66575feaa
    provenance:
      repo: Brad-Edwards/bigrae
