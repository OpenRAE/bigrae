schema_version: 1
project: shifter
github_repo: OpenRAE/bigrae
workflow:
  # The root Makefile provides the no-service completion and policy boundaries
  # consumed by the synchronized /implement workflow.
  completion_command: make test
  lint_command: python3 scripts/adr_guard/adr_guard.py --all --level ci
  # Scope the /implement publish pre-commit gate to the staged (changed) files
  # instead of the whole repo. Every pre-commit hook is already `files:`-scoped,
  # so `pre-commit run` fires only the changed module's hooks (e.g. a
  # shifter_platform-only change skips the packer/provisioner/bootstrap/
  # installation/terraform/mcp test+lint hooks). CI's quality-path-ownership
  # contract (ADR, `.github/quality-path-filters.yaml`) remains the authoritative
  # full-matrix gate that guarantees blocking lint+security+test coverage for
  # every production path, so this only removes redundant local re-runs. A
  # developer may still run `pre-commit run --all-files` by hand.
  precommit_command: pre-commit run
  design:
    compile_command: cd shifter/shifter_platform && uv run python -m compileall -q cms shared tests
    structural_command: cd shifter/shifter_platform && uv run lint-imports --config ../../.importlinter
    wiring_command: cd shifter/shifter_platform && uv run python tests/design_checks.py wiring
    acceptance_command: cd shifter/shifter_platform && TESTING=1 TEST_DB_BACKEND=sqlite uv run python tests/design_checks.py acceptance
  codex_review:
    pre_push_cap: 1
  review_disposition:
    enabled: false
    mode: shadow
    max_auto_overrides: 0
    judge:
      enabled: false
sonarcloud:
  project_key: Brad-Edwards_shifter
  organization: brad-edwards
routing:
  # Only `enabled`, `default_provider`, and `stages` are accepted here. An
  # unrecognized key fails the whole file closed and blocks /implement.
  enabled: true
  default_provider: claude
rules:
  plan_rules: .gc/plan-rules.md
architecture:
  modules:
    - path: .
      implementations: [scripts/adr_guard/adr_guard.py]
      adrs: [docs/technical/dev/adr-enforcement.md, docs/technical/architecture.md, docs/adr/069-repository-identity.md]
    - path: shifter/shifter_platform/cms
      implementations: [shifter/shifter_platform/cms/services/_experiment_batches.py, shifter/shifter_platform/cms/services/_trial_archives.py]
      adrs: [docs/architecture/experiment-admission-design-2742.md, docs/architecture/trial-archive-custody.md]
    - path: shifter/shifter_platform/shared/raes
      implementations: [shifter/shifter_platform/shared/raes/experiment_admission.py, shifter/shifter_platform/shared/raes/trial_archive.py]
      adrs: [docs/architecture/raes-migration-adr.md, docs/architecture/trial-archive-custody.md]
